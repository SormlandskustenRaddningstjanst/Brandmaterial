<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Brandmaterial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css?v=20260922-import-popup-v3">
</head>
<body>
<header>
  <div class="header-inner">
    <img class="logo" src="https://www.nykoping.se/globalassets/_system/logo-skrtj-ny.png" alt="Sörmlandskustens räddningstjänst">
    <h1>Brandmaterial</h1>
    <p>Register</p>
  </div>
</header>
<div class="header-rule"></div>
<main>
  <div class="toolbar"><a class="back" href="./">← LAGERÖVERSIKT</a></div>
  <section class="hero"><h2>Register</h2><p>Grunduppgifter för stationer, fordon och brandmaterial.</p></section>

  <div id="registerLoading" class="card">Hämtar register…</div>
  <div id="registerError" class="message error"></div>

  <section id="registerContent" style="display:none">
    <div class="register-menu">
      <button class="register-tile" data-view="stations"><span class="icon">🏢</span><strong>Stationer</strong><small id="stationCount">0 poster</small></button>
      <button class="register-tile" data-view="vehicles"><span class="icon">🚒</span><strong>Fordon</strong><small id="vehicleCount">0 poster</small></button>
      <button class="register-tile" data-view="material"><span class="icon">🧰</span><strong>Brandmaterial</strong><small id="materialCount">0 poster</small></button>
    </div>

    <section id="listPanel" class="card list-panel" style="display:none">
      <div class="list-head">
        <div><h3 id="listTitle">Register</h3><div id="listHelp" class="muted"></div></div>
        <button id="closeList" class="secondary">STÄNG</button>
      </div>
      <div class="actions">
        <button id="importBtn">⬆ IMPORTERA EXCEL</button>
        <button id="exportBtn">⬇ EXPORTERA EXCEL</button>
        <button id="templateBtn" class="secondary">📄 LADDA NER MALL</button>
        <button id="newCategoryBtn" class="yellow" style="display:none">+ NY KATEGORI</button>
        <input id="fileInput" type="file" accept=".xlsx" hidden>
      </div>
      <div id="importMessage" class="message"></div>
      <div id="categoryPanel" class="category-panel" style="display:none">
        <label for="newCategoryName">Ny fordonskategori</label>
        <div class="category-create-row">
          <input id="newCategoryName" type="text" maxlength="100" placeholder="Exempel: Släckbil">
          <button id="saveCategoryBtn">SKAPA</button>
          <button id="cancelCategoryBtn" class="secondary">AVBRYT</button>
        </div>
        <div id="categoryMessage" class="message"></div>
        <div id="categoryList" class="category-list"></div>
      </div>
      <label class="search">Sök <input id="searchInput" type="search" placeholder="Sök i registret…"></label>
      <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
    </section>
  </section>
  <footer>Sörmlandskustens räddningstjänst · Brandmaterial</footer>
</main>

<div id="importOverlay" class="import-overlay" aria-hidden="true">
  <div class="import-modal" role="dialog" aria-modal="true" aria-labelledby="importOverlayTitle">
    <div id="importSpinner" class="import-spinner" aria-hidden="true"></div>
    <h2 id="importOverlayTitle">Uppdatering pågår…</h2>
    <p id="importOverlayText">Registret uppdateras. Stäng inte sidan.</p>
    <button id="importOverlayClose" class="secondary" style="display:none">STÄNG</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="register.js?v=20260922-import-popup-v3"></script>
</body>
</html>
