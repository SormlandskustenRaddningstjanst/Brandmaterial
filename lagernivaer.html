<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagernivåer – Brandmaterial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lagernivaer.css?v=20260923-popup-v2">
</head>
<body>
<header>
  <div class="header-inner">
    <img class="logo" src="https://www.nykoping.se/globalassets/_system/logo-skrtj-ny.png" alt="Sörmlandskustens räddningstjänst">
    <h1>Brandmaterial</h1>
    <p>Lagernivåer</p>
  </div>
</header>
<div class="header-rule"></div>
<main>
  <div class="toolbar">
    <a class="back" href="./">← LAGERÖVERSIKT</a>
    <a class="back" href="register.html">▦ REGISTER</a>
  </div>

  <section class="hero">
    <h2>Lagernivåer</h2>
    <p>Lagernivåerna styrs av valet Min station på Lageröversikten.</p>
  </section>

  <div id="loading" class="card">Hämtar lagernivåer…</div>
  <div id="error" class="message error"></div>

  <section id="content" style="display:none">
    <div class="type-switch">
      <button id="stationsTab" class="type-button active" type="button">🏢 STATION</button>
      <button id="vehiclesTab" class="type-button" type="button">🚒 FORDON</button>
      <button id="consumablesTab" class="type-button" type="button">📦 FÖRBRUKNINGSARTIKLAR</button>
      <button id="exerciseTab" class="type-button" type="button">🎯 ÖVNING</button>
    </div>

    <div id="selectorCard" class="selector-card card">
      <label id="selectorLabel" for="targetSelect">Fordon på min station</label>
      <select id="targetSelect"></select>
    </div>

    <div id="planHead" class="plan-head">
      <div>
        <h3 id="planTitle">–</h3>
        <p id="planHelp" class="muted"></p>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div id="planList" class="plan-list"></div>
  </section>
</main>
<footer>Sörmlandskustens räddningstjänst · Brandmaterial</footer>
<div id="editModal" class="edit-modal hidden" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="edit-card">
    <div class="edit-head">
      <div><h3 id="editTitle">Redigera</h3><p id="editSubtitle" class="muted"></p></div>
      <button id="editClose" class="edit-close" type="button" aria-label="Stäng">×</button>
    </div>
    <div id="editMessage" class="message"></div>
    <div id="editFields" class="edit-fields"></div>
    <div class="edit-actions">
      <button id="editCancel" type="button" class="cancel-button">AVBRYT</button>
      <button id="editSave" type="button" class="save-button">SPARA</button>
    </div>
  </div>
</div>
<script src="lagernivaer.js?v=20260923-popup-v2"></script>
</body>
</html>
